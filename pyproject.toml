[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "srfforge"
version = "0.1.0"
description = "Convolve hyperspectral data between remote sensing instruments"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "h5py>=3.7",
]

[project.optional-dependencies]
earthdata = [
    "earthaccess>=0.9",
]
tutorials = [
    "earthaccess>=0.9",
    "matplotlib>=3.5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/srfforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
