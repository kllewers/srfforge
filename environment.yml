name: srfforge
channels:
  - conda-forge
dependencies:
  # Python
  - python=3.11

  # Core (packages with C extensions are more reliable from conda-forge)
  - numpy>=1.23
  - scipy>=1.9
  - h5py>=3.7

  # Search extras
  - earthaccess>=0.9
  - pyproj>=3.4
  - shapely>=2.0

  # Plot extras
  - matplotlib>=3.5

  # EMIT / NetCDF4 reading
  - netcdf4>=1.6        # xarray engine for EMIT L2A files
  - xarray>=2023.1

  # Tutorials
  - jupyter
  - jupyterlab

  # Dev
  - pytest>=7.0
  - pytest-cov

  # pip-only packages (not reliably available on conda-forge)
  - pip
  - pip:
    - neonutilities>=0.4
    - -e .          # installs srfforge itself in editable mode
